<header class="header">
  <div class="header-container">
    <!-- Left Section: Menu & Logo -->
    <div class="left-section">
      <p-button 
        [text]="true" 
        size="small"
        icon="pi pi-bars"
        (onClick)="onMenuClick()"
        styleClass="menu-button">
      </p-button>
      
      <div class="logo-container">
        <div class="logo-icon">
          <span>B</span>
        </div>
        <span class="logo-text">Brandbot</span>
      </div>
    </div>

    <!-- Right Section: Action Buttons -->
    <div class="right-section">
      <app-theme-toggle></app-theme-toggle>
      
      <div class="user-menu-container">
        <div (click)="userMenu.toggle($event)" class="cursor-pointer">
          <app-avatar
            [initials]="userInitials()"
            [clickable]="true">
          </app-avatar>
        </div>

        <app-tiered-menu
          #userMenu
          [model]="userMenuModels()"
          [popup]="true">
        </app-tiered-menu>
      </div>
    </div>
  </div>
</header>

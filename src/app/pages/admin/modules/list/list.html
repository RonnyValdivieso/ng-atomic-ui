<div class="page-head">
  <div>
    <h1 class="page-title">Modules &amp; Permissions</h1>
    <p class="page-sub">Feature modules and their permission matrices.</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus ico-sm"></i>New module
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="modules()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  searchPlaceholder="Search by name…"
  emptyMessage="No modules found."
  (query)="load($event)"
  (rowClick)="viewDetails($event)">

  <ng-template appDataCell="actions" let-mod>
    @let m = $any(mod);
    <div class="row-actions" (click)="$event.stopPropagation()">
      <app-copy-id-button [value]="m.id" />
      <button type="button" class="row-act-btn" aria-label="View" (click)="viewDetails(m)">
        <i class="pi pi-eye ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn" aria-label="Edit" (click)="openEdit(m)">
        <i class="pi pi-pencil ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn row-act-danger" aria-label="Delete" (click)="delete(m)">
        <i class="pi pi-trash ico-sm"></i>
      </button>
    </div>
  </ng-template>
</app-data-table>

<app-module-form
  [(visible)]="isModalVisible"
  [isEditing]="isEditing()"
  [current]="currentModule"
  [saving]="saving()"
  (save)="save($event)">
</app-module-form>

<app-confirm-dialog
  [(visible)]="isDeleteVisible"
  title="Delete module"
  [message]="deleteMessage"
  confirmLabel="Delete"
  [loading]="deleting()"
  (confirmed)="confirmDelete()">
</app-confirm-dialog>

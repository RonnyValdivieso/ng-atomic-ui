<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-surface-900">Workspaces</h1>
      <p class="text-muted-color text-sm mt-1">All instances across the platform.</p>
    </div>
  </div>

  <app-table
    [data]="workspaces()"
    [columns]="columns"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    [rows]="pageSize()"
    (page)="onPage($event)">
    <ng-template pTemplate="actions" let-workspace>
      <div class="flex justify-end gap-2">
        <app-button
          icon="login"
          variant="primary"
          label="Open"
          (click)="open(workspace)">
        </app-button>
      </div>
    </ng-template>
  </app-table>
</div>

<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-surface-900">Notification Templates</h1>
      <p class="text-muted-color text-sm mt-1">Plantillas de email / notificaciones del sistema.</p>
    </div>
    <app-button label="Nueva plantilla" icon="pi pi-plus" (clicked)="openCreate()"></app-button>
  </div>

  <app-table
    [data]="templates()"
    [columns]="columns"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    [rows]="pageSize()"
    [lazy]="true"
    (page)="onPage($event)">

    <ng-template pTemplate="actions" let-tpl>
      <div class="flex justify-end gap-2">
        <app-button icon="pi pi-eye" variant="ghost" (clicked)="viewDetails(tpl)"></app-button>
        <app-button icon="pi pi-pencil" variant="ghost" (clicked)="openEdit(tpl)"></app-button>
        <app-button icon="pi pi-trash" variant="ghost" (clicked)="delete(tpl)"></app-button>
      </div>
    </ng-template>
  </app-table>

  <app-notification-template-form
    [(visible)]="isModalVisible"
    [isEditing]="isEditing()"
    [current]="currentTemplate"
    [saving]="saving()"
    (save)="save($event)">
  </app-notification-template-form>

  <app-confirm-dialog
    [(visible)]="isDeleteVisible"
    title="Eliminar plantilla"
    [message]="deleteMessage"
    confirmLabel="Eliminar"
    [loading]="deleting()"
    (confirmed)="confirmDelete()">
  </app-confirm-dialog>
</div>

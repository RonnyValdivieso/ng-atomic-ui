<div class="page-head">
  <div>
    <h1 class="page-title">Notification Templates</h1>
    <p class="page-sub">Email and in-app message templates.</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus ico-sm"></i>New template
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="templates()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  searchPlaceholder="Search by name…"
  emptyMessage="No notification templates found."
  (query)="load($event)"
  (rowClick)="viewDetails($event)">

  <ng-template appDataCell="actions" let-tpl>
    @let t = $any(tpl);
    <div class="row-actions" (click)="$event.stopPropagation()">
      <app-copy-id-button [value]="t.id" />
      <button type="button" class="row-act-btn" aria-label="View" (click)="viewDetails(t)">
        <i class="pi pi-eye ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn" aria-label="Edit" (click)="openEdit(t)">
        <i class="pi pi-pencil ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn row-act-danger" aria-label="Delete" (click)="delete(t)">
        <i class="pi pi-trash ico-sm"></i>
      </button>
    </div>
  </ng-template>
</app-data-table>

<app-notification-template-form
  [(visible)]="isModalVisible"
  [isEditing]="isEditing()"
  [current]="currentTemplate"
  [saving]="saving()"
  (save)="save($event)">
</app-notification-template-form>

<app-confirm-dialog
  [(visible)]="isDeleteVisible"
  title="Delete template"
  [message]="deleteMessage"
  confirmLabel="Delete"
  [loading]="deleting()"
  (confirmed)="confirmDelete()">
</app-confirm-dialog>

<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-surface-900">Organizaciones</h1>
      <p class="text-muted-color text-sm mt-1">Todas las organizaciones de la plataforma.</p>
    </div>
  </div>

  <app-table
    [data]="organizations()"
    [columns]="columns"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    [rows]="pageSize()"
    (page)="onPage($event)">
    <ng-template pTemplate="actions" let-org>
      <div class="flex justify-end gap-2">
        <app-button
          icon="pi pi-eye"
          variant="secondary"
          (clicked)="open(org)">
        </app-button>
      </div>
    </ng-template>
  </app-table>
</div>

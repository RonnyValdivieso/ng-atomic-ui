<div class="page-head">
  <div>
    <h1 class="page-title">Organizations</h1>
    <p class="page-sub">All registered organizations on the platform.</p>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="organizations()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  searchPlaceholder="Search by name, owner, or email…"
  emptyMessage="No organizations found."
  (query)="load($event)"
  (rowClick)="open($event)">
</app-data-table>

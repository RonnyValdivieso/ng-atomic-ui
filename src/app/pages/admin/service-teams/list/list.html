<div class="page-head">
  <div>
    <h1 class="page-title">Service Teams</h1>
    <p class="page-sub">Internal teams responsible for operating the platform.</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus ico-sm"></i>New service team
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="serviceTeams()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  searchPlaceholder="Search by name or email…"
  emptyMessage="No service teams found."
  (query)="load($event)"
  (rowClick)="viewDetails($event)">

  <ng-template appDataCell="code" let-team>
    @let code = $any(team).code;
    @if (code) {
      <span class="code-pill">{{ code }}</span>
    } @else {
      <span class="empty-dash">—</span>
    }
  </ng-template>

  <ng-template appDataCell="actions" let-team>
    @let st = $any(team);
    <div class="row-actions" (click)="$event.stopPropagation()">
      <app-copy-id-button [value]="st.id" />
      <button type="button" class="row-act-btn" aria-label="View" (click)="viewDetails(st)">
        <i class="pi pi-eye ico-sm"></i>
      </button>
      <app-row-actions-menu [items]="menuFor(st)" />
    </div>
  </ng-template>
</app-data-table>

<app-service-team-form
  [(visible)]="isModalVisible"
  [isEditing]="isEditing()"
  [current]="currentTeam"
  [saving]="saving()"
  (save)="save($event)">
</app-service-team-form>

<app-confirm-dialog
  [(visible)]="isDeleteVisible"
  title="Delete service team"
  [message]="deleteMessage"
  confirmLabel="Delete"
  [loading]="deleting()"
  (confirmed)="confirmDelete()">
</app-confirm-dialog>

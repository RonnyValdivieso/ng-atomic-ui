<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-surface-900">Roles</h1>
      <p class="text-muted-color text-sm mt-1">Roles del sistema y sus permisos asignados.</p>
    </div>
    <app-button label="Nuevo rol" icon="pi pi-plus" (clicked)="openCreate()"></app-button>
  </div>

  <app-table
    [data]="roles()"
    [columns]="columns"
    [loading]="loading()"
    [totalRecords]="totalRecords()"
    [rows]="pageSize()"
    [lazy]="true"
    (page)="onPage($event)">

    <ng-template pTemplate="scope" let-role>
      @if (isGlobal(role)) {
        <span class="text-surface-700">Global</span>
      } @else {
        <span class="text-surface-500 font-mono text-xs">{{ role.instanceId }}</span>
      }
    </ng-template>

    <ng-template pTemplate="actions" let-role>
      <div class="flex justify-end gap-2">
        <app-button icon="pi pi-eye" variant="ghost" (clicked)="viewDetails(role)"></app-button>
        <app-button icon="pi pi-pencil" variant="ghost" (clicked)="openEdit(role)"></app-button>
        <app-button icon="pi pi-trash" variant="ghost" (clicked)="delete(role)"></app-button>
      </div>
    </ng-template>
  </app-table>

  <app-role-form
    [(visible)]="isModalVisible"
    [isEditing]="isEditing()"
    [current]="currentRole"
    [saving]="saving()"
    (save)="save($event)">
  </app-role-form>
</div>

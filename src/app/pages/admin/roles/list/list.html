<div class="page-head">
  <div>
    <h1 class="page-title">System Roles</h1>
    <p class="page-sub">Role definitions used across the system.</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" (click)="openCreate()">
      <i class="pi pi-plus ico-sm"></i>New role
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [data]="roles()"
  [loading]="loading()"
  [totalRecords]="totalRecords()"
  searchPlaceholder="Search by name…"
  emptyMessage="No roles found."
  (query)="load($event)"
  (rowClick)="viewDetails($event)">

  <ng-template appDataCell="actions" let-role>
    @let r = $any(role);
    <div class="row-actions" (click)="$event.stopPropagation()">
      <app-copy-id-button [value]="r.id" />
      <button type="button" class="row-act-btn" aria-label="View" (click)="viewDetails(r)">
        <i class="pi pi-eye ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn" aria-label="Edit" (click)="openEdit(r)">
        <i class="pi pi-pencil ico-sm"></i>
      </button>
      <button type="button" class="row-act-btn row-act-danger" aria-label="Delete" (click)="delete(r)">
        <i class="pi pi-trash ico-sm"></i>
      </button>
    </div>
  </ng-template>
</app-data-table>

<app-role-form
  [(visible)]="isModalVisible"
  [isEditing]="isEditing()"
  [current]="currentRole"
  [saving]="saving()"
  (save)="save($event)">
</app-role-form>

<app-confirm-dialog
  [(visible)]="isDeleteVisible"
  title="Delete role"
  [message]="deleteMessage"
  confirmLabel="Delete"
  [loading]="deleting()"
  (confirmed)="confirmDelete()">
</app-confirm-dialog>

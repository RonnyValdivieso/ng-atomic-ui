<div class="login-container">
  @if (auth.pendingChallenge(); as challenge) {
    <app-login-code
      [challenge]="challenge"
      [remainingSeconds]="auth.challengeRemainingSeconds()"
      [loading]="isLoading()"
      [errorMessage]="codeError() ?? ''"
      (submitted)="onCodeSubmitted($event)"
      (cancelled)="onCodeCancelled()">
    </app-login-code>
  } @else {
    <app-card header="Iniciar Sesión" class="login-card-wrapper" [elevation]="4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <app-form-field
          label="Email"
          formControlName="email"
          type="email"
          placeholder="tu@email.com"
          [errorMessage]="loginForm.get('email')?.errors && loginForm.get('email')?.touched ? 'Email requerido' : ''">
        </app-form-field>

        <app-form-field
          label="Contraseña"
          formControlName="password"
          type="password"
          placeholder="••••••••"
          [errorMessage]="loginForm.get('password')?.errors && loginForm.get('password')?.touched ? 'Contraseña requerida' : ''">
        </app-form-field>

        @if (error()) {
          <div class="login-error">{{ error() }}</div>
        }

        <app-button
          label="Entrar"
          type="submit"
          [loading]="isLoading()"
          [disabled]="loginForm.invalid || isLoading()"
          style="width: 100%"
        ></app-button>
      </form>

      <!--
        SSO buttons hidden pending Azure App Registration fix (needs SPA
        platform + http://localhost:4200 redirect URI). Wiring is in place
        — re-enable by un-commenting this block.

      @if (googleEnabled || microsoftEnabled) {
        <div class="login-divider"><span>o</span></div>

        <div class="login-sso">
          @if (microsoftEnabled) {
            <app-button
              label="Continuar con Microsoft"
              variant="secondary"
              icon="pi pi-microsoft"
              [loading]="isLoading()"
              [disabled]="isLoading()"
              (clicked)="onMicrosoftSignIn()"
              style="width: 100%">
            </app-button>
          }
          @if (googleEnabled) {
            <app-button
              label="Continuar con Google"
              variant="secondary"
              icon="pi pi-google"
              [loading]="isLoading()"
              [disabled]="isLoading()"
              (clicked)="onGoogleSignIn()"
              style="width: 100%">
            </app-button>
          }
        </div>
      }
      -->

    </app-card>
  }
</div>

<app-modal
  [visible]="visible"
  (visibleChange)="closeModal()"
  [header]="modalTitle"
  [style]="{ width: '400px' }">
  
  <form [formGroup]="form" class="flex flex-col gap-4 py-4">
    <app-form-field
      label="Code"
      formControlName="code"
      [disabled]="isEditing"
      placeholder="e.g., S3">
    </app-form-field>
    
    <app-form-field
      label="Name"
      formControlName="name"
      placeholder="e.g., Amazon S3">
    </app-form-field>
    
    <app-form-field
      label="Description"
      formControlName="description"
      placeholder="Optional description">
    </app-form-field>
  </form>

  <div footer class="flex justify-end gap-2">
    <app-button 
      label="Cancel" 
      variant="secondary" 
      (click)="closeModal()">
    </app-button>
    <app-button 
      label="Save" 
      (click)="onSave()"
      [loading]="saving">
    </app-button>
  </div>
</app-modal>

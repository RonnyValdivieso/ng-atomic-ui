name: Regenerate Lockfile (Linux)

# One-off helper: regenerates `package-lock.json` on Ubuntu so the nested
# install records for platform-specific deps are written, then commits the
# result back to the triggering branch. Run this any time CI's `npm ci`
# complains about missing entries that don't show up when installing on macOS.
#
# Trigger from the Actions tab → "Regenerate Lockfile (Linux)" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Need a token that can push back. Default GITHUB_TOKEN works when
          # `permissions.contents: write` is set (above).
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Wipe lockfile + node_modules
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install (writes a fresh, Linux-aware lock)
        run: npm install --include=optional --no-audit --no-fund

      - name: Restore strict `npm ci` in workflow + Dockerfiles
        run: |
          sed -i \
            -e 's|- run: npm install --no-save --no-audit --no-fund|- run: npm ci|' \
            .github/workflows/tests.yml || true
          for df in Dockerfile.stg Dockerfile.prod; do
            sed -i \
              -e 's|RUN npm install --no-save --no-audit --no-fund --loglevel=error|RUN npm ci --loglevel=error|' \
              "$df" || true
          done

      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/tests.yml Dockerfile.stg Dockerfile.prod
          if git diff --cached --quiet; then
            echo "No changes to commit — lockfile is already Linux-aware."
          else
            git commit -m "chore(lockfile): regenerate on Linux + restore npm ci

Adds the nested platform-specific install records that macOS npm omits,
so CI + Docker builds can use \`npm ci\` strictly again.

Generated by .github/workflows/regenerate-lockfile.yml"
            git push
          fi
